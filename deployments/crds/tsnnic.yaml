apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tsnnics.tsn.dra.net
spec:
  group: tsn.dra.net
  scope: Cluster
  names:
    plural: tsnnics
    singular: tsnnic
    kind: TSNNic
    shortNames: [tnic]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Node
          type: string
          jsonPath: .spec.nodeName
        - name: If
          type: string
          jsonPath: .spec.ifName
        - name: TSN
          type: boolean
          jsonPath: .spec.tsnCapable
        - name: HostIP
          type: string
          jsonPath: .spec.hostIP
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [nodeName, ifName, tsnCapable]
              properties:
                nodeName: { type: string }
                ifName: { type: string }
                pciAddress: { type: string }
                macAddress: { type: string }
                hostIP: { type: string }
                tsnCapable: { type: boolean }
                features:
                  type: array
                  items: { type: string }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
