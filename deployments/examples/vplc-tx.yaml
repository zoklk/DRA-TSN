# Example vPLC workload claiming a TSN TX stream in domain cell-A. The DRA
# scheduler places the pod on the node whose ResourceSlice advertises a matching
# stream device (TSN-aware placement). NRI then tags egress + injects TSN_STREAMS.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: tsn-tx-cell-a
  namespace: dratsn-test
spec:
  spec:
    devices:
      requests:
        - name: tsn-stream
          exactly:
            deviceClassName: tsn.dra.net
            selectors:
              - cel:
                  expression: >-
                    device.attributes['tsn.dra.net'].domainId == 'cell-A' &&
                    device.attributes['tsn.dra.net'].direction == 'TX'
---
apiVersion: v1
kind: Pod
metadata:
  name: vplc-tx
  namespace: dratsn-test
  labels:
    app: vplc
spec:
  restartPolicy: Never
  containers:
    - name: vplc
      image: busybox:1.36
      command: ["sh", "-c", "echo vPLC up; env | grep TSN_ || true; sleep 3600"]
      resources:
        claims:
          - name: tsn
  resourceClaims:
    - name: tsn
      resourceClaimTemplateName: tsn-tx-cell-a
