apiVersion: v1
kind: ServiceAccount
metadata:
  name: dratsn
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dratsn
rules:
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["deviceclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["tsn.dra.net"]
    resources: ["tsnnics"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["tsn.dra.net"]
    resources: ["tsnstreams"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dratsn
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dratsn
subjects:
  - kind: ServiceAccount
    name: dratsn
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dratsn
  namespace: kube-system
spec:
  selector:
    matchLabels: { app: dratsn }
  template:
    metadata:
      labels: { app: dratsn }
    spec:
      serviceAccountName: dratsn
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      # Standard DRA pattern: run on every node. Each node discovers its own
      # TSN-capable NICs (tsn.dra.net/capable-nics label / TSN_CAPABLE_NICS env)
      # and advertises only its local streams; nodes without a TSN NIC publish an
      # empty ResourceSlice (liveness). tolerations=Exists so it also covers
      # control-plane / tainted nodes that may carry a TSN NIC.
      tolerations:
        - operator: Exists
      containers:
        - name: driver
          image: REGISTRY/dratsn-driver:TAG
          imagePullPolicy: Always
          args:
            - "-driver-name=tsn.dra.net"
            - "-dataplane=true"
            - "-v=2"
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: plugins-registry
              mountPath: /var/lib/kubelet/plugins_registry
            - name: plugins
              mountPath: /var/lib/kubelet/plugins
              mountPropagation: Bidirectional
            - name: nri-socket
              mountPath: /var/run/nri
            - name: bpffs
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            - name: netns
              mountPath: /var/run/netns
              mountPropagation: HostToContainer
            - name: checkpoint
              mountPath: /var/lib/dratsn
      volumes:
        - name: plugins-registry
          hostPath: { path: /var/lib/kubelet/plugins_registry, type: Directory }
        - name: plugins
          hostPath: { path: /var/lib/kubelet/plugins, type: Directory }
        - name: nri-socket
          hostPath: { path: /var/run/nri, type: DirectoryOrCreate }
        - name: bpffs
          hostPath: { path: /sys/fs/bpf, type: Directory }
        - name: netns
          hostPath: { path: /var/run/netns, type: DirectoryOrCreate }
        - name: checkpoint
          hostPath: { path: /var/lib/dratsn, type: DirectoryOrCreate }
